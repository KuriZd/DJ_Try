<!doctype html>
<html lang="es-MX">
  <head><meta charset="utf-8"><title>{{ asunto }}</title></head>
  <body style="margin:0;padding:24px;background:#f4f7f5;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#0e1a16;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #dde7e2;border-radius:12px;overflow:hidden;">
      <tr><td style="height:4px;background:linear-gradient(90deg,#0f3d2e,#1f7a5c 45%,#a97c2f);"></td></tr>
      <tr><td style="padding:28px 32px;">
        {% block cuerpo %}{% endblock %}
      </td></tr>
      <tr><td style="padding:18px 32px;border-top:1px solid #e7eeeb;color:#5f6f68;font-size:12px;line-height:1.5;">
        Asociación Mexicana de Instituciones de Seguros<br>
        Este mensaje se envió automáticamente. No respondas a esta dirección.
      </td></tr>
    </table>
  </body>
</html>
