<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <title>{{ titulo }}</title>
  <meta name="description" content="{{ descripcion }}">
  <link rel="canonical" href="{{ destino }}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="AMIS · Actualiza">
  <meta property="og:title" content="{{ titulo }}">
  <meta property="og:description" content="{{ descripcion }}">
  <meta property="og:url" content="{{ destino }}">
  <meta property="og:locale" content="es_MX">
  <meta property="article:published_time" content="{{ publicada_en|date:'c' }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ titulo }}">
  <meta name="twitter:description" content="{{ descripcion }}">
  <meta http-equiv="refresh" content="0; url={{ destino }}">
</head>
<body>
  <p><a href="{{ destino }}">Ver la publicación en Actualiza</a></p>
</body>
</html>
