name: Backend release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dj_try_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: tests.ci_settings
      POSTGRES_DB: dj_try_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python manage.py collectstatic --noinput
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt --no-deps --disable-pip
